<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Teal Cyan Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- House Body Gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Rounded Shield / App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Golden Border Ring -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- 2. Main Central Shield / Emblem Background -->
  <path d="M 256 60 L 410 115 C 410 260 345 365 256 405 C 167 365 102 260 102 115 Z" 
        fill="#042f2e" stroke="url(#goldGrad)" stroke-width="5" filter="url(#dropShadow)"/>

  <!-- Inner Shield Subtle Fill -->
  <path d="M 256 75 L 395 125 C 395 250 335 348 256 385 C 177 348 117 250 117 125 Z" 
        fill="url(#tealGrad)" opacity="0.18"/>

  <!-- 3. HOUSE ROOF & CHIMNEY (Home Care Symbol) -->
  <!-- Chimney with smoke spark -->
  <rect x="305" y="105" width="22" height="40" rx="3" fill="url(#goldGrad)"/>
  <circle cx="316" cy="95" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="320" cy="84" r="3" fill="#fbbf24" opacity="0.5"/>

  <!-- Roof Peak -->
  <path d="M 256 95 L 380 185 L 358 198 L 256 125 L 154 198 L 132 185 Z" 
        fill="url(#roofGrad)" filter="url(#dropShadow)"/>

  <!-- House Body / Wall Base -->
  <path d="M 160 190 L 352 190 L 352 310 C 352 335 310 355 256 362 C 202 355 160 335 160 310 Z" 
        fill="url(#houseGrad)" opacity="0.95"/>

  <!-- 4. HANDYMAN TOOLS (Crossed Wrench & Hammer / Screwdriver) -->
  <g filter="url(#dropShadow)">
    
    <!-- TOOL 1: Adjustable Wrench / Spanner (Left-leaning) -->
    <g transform="translate(256, 245) rotate(-42) translate(-256, -245)">
      <!-- Wrench Handle -->
      <rect x="246" y="170" width="20" height="150" rx="6" fill="#334155"/>
      <rect x="250" y="180" width="12" height="130" rx="4" fill="#64748b"/>
      <!-- Wrench Head -->
      <path d="M 236 175 C 236 150 276 150 276 175 L 268 185 L 244 185 Z" fill="#0f172a"/>
      <!-- Wrench Jaw Cutout -->
      <polygon points="250,152 262,152 262,168 250,168" fill="#f1f5f9"/>
      <!-- Bottom hole -->
      <circle cx="256" cy="305" r="5" fill="#f1f5f9"/>
    </g>

    <!-- TOOL 2: Claw Hammer / Precision Screwdriver (Right-leaning) -->
    <g transform="translate(256, 245) rotate(42) translate(-256, -245)">
      <!-- Handle -->
      <rect x="246" y="170" width="20" height="150" rx="6" fill="#b45309"/>
      <rect x="250" y="180" width="12" height="130" rx="4" fill="#f59e0b"/>
      <!-- Grip stripes -->
      <line x1="246" y1="260" x2="266" y2="260" stroke="#78350f" stroke-width="3"/>
      <line x1="246" y1="275" x2="266" y2="275" stroke="#78350f" stroke-width="3"/>
      <line x1="246" y1="290" x2="266" y2="290" stroke="#78350f" stroke-width="3"/>
      <!-- Hammer Head -->
      <path d="M 232 160 L 278 160 C 285 160 288 172 280 178 L 268 182 L 244 182 L 232 175 Z" fill="#334155"/>
      <rect x="230" y="156" width="14" height="26" rx="2" fill="#64748b"/>
    </g>
    
  </g>

  <!-- 5. CENTRAL BADGE: Electrician Spark + Water Droplet + Gas Flame -->
  <!-- Center Circular Badge -->
  <circle cx="256" cy="245" r="44" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#dropShadow)"/>

  <!-- ELECTRIC LIGHTNING BOLT (Left of center badge) -->
  <path d="M 252 215 L 240 240 L 251 240 L 244 268 L 268 238 L 255 238 Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- PLUMBING WATER DROPLET (Right of center badge) -->
  <path d="M 264 220 C 264 220 276 235 276 244 C 276 252 270 258 262 258 C 254 258 248 252 248 244 C 248 235 264 220 264 220 Z" 
        fill="#38bdf8" opacity="0.85"/>

  <!-- 6. THREE GOLD STARS (Quality & 7-Day Warranty Badge) -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Star Left -->
    <polygon points="205,320 208,328 217,329 210,335 212,344 205,339 198,344 200,335 193,329 202,328" transform="scale(0.85) translate(36, 50)"/>
    <!-- Star Center (Bigger) -->
    <polygon points="256,322 260,332 271,333 263,340 266,351 256,345 246,351 249,340 241,333 252,332"/>
    <!-- Star Right -->
    <polygon points="307,320 310,328 319,329 312,335 314,344 307,339 300,344 302,335 295,329 304,328" transform="scale(0.85) translate(56, 50)"/>
  </g>

  <!-- 7. BRAND TEXT BANNER: B.A.H.CARE -->
  <!-- Golden Ribbon Plate -->
  <path d="M 120 415 L 392 415 L 376 458 L 256 468 L 136 458 Z" 
        fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Ribbon Ends -->
  <path d="M 120 415 L 96 436 L 120 458 L 136 458 L 120 415 Z" fill="#b45309"/>
  <path d="M 392 415 L 416 436 L 392 458 L 376 458 L 392 415 Z" fill="#b45309"/>

  <!-- English Brand Text: B.A.H.Care -->
  <text x="256" y="448" 
        font-family="'Outfit', 'Arial Black', sans-serif" 
        font-size="27" 
        font-weight="900" 
        letter-spacing="2.5" 
        fill="#042f2e" 
        text-anchor="middle">
    B.A.H.CARE
  </text>

  <!-- Subtitle Tag: BIN ABBAS HOME CARE -->
  <text x="256" y="488" 
        font-family="'Outfit', sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#2dd4bf" 
        text-anchor="middle">
    BIN ABBAS HOME CARE
  </text>
</svg>
